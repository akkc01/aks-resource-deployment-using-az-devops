name: build-pipeline

trigger:
  branches:
    include:
      - main
#     - features/*

pool:
  name: dev-aks-akkc-agent

stages:

# ============================================================
# Stage 1: Terraform Install + Init + Validate + Format + Plan
# ============================================================
- stage: terraform_install_init_plan
  displayName: "Terraform Install, Init and Plan"

  jobs:
  - job: terraform_install_and_init
    displayName: "Terraform Init and Plan"

    steps:

    # Checkout repository
    - checkout: self
      displayName: "Checkout Repository"

    # Install Terraform
    - script: |
        echo "Terraform path:"
        which terraform

        echo "Terraform version:"
        terraform version
      displayName: "Verify Terraform"

    # Verify Terraform
    - script: |
        echo "Terraform location:"
        which terraform

        echo ""
        echo "Terraform version:"
        terraform version

        echo ""
        echo "Terraform binary:"
        file "$(which terraform)"
      displayName: "Verify Terraform"


    - script: |
        echo "===== USER ====="
        whoami

        echo "===== HOME ====="
        echo "$HOME"

        echo "===== PATH ====="
        echo "$PATH"

        echo "===== TERRAFORM ====="
        which terraform || true

        echo "===== TERRAFORM FILE ====="
        ls -la /opt/homebrew/bin/terraform || true

        echo "===== FILE TYPE ====="
        file /opt/homebrew/bin/terraform || true

        echo "===== PERMISSION ====="
        stat /opt/homebrew/bin/terraform || true

        echo "===== DIRECT EXECUTION ====="
        /opt/homebrew/bin/terraform version || true

        echo "===== ARCH ====="
        uname -m
      displayName: "Debug Terraform Agent Environment"

    # Terraform Init
    - task: TerraformTask@5
      displayName: "Terraform Initialization"
      inputs:
        provider: "azurerm"
        command: "init"
        workingDirectory: "$(System.DefaultWorkingDirectory)/env/dev"
        backendServiceArm: "azure-ado-sc-unnaoit"
        backendAzureRmResourceGroupName: "akkc"
        backendAzureRmStorageAccountName: "azureadostgtest01"
        backendAzureRmContainerName: "terraformstate"
        backendAzureRmKey: "dev.terraform.tfstate"

    # Terraform Validate
    - task: TerraformTask@5
      displayName: "Terraform Validate"
      inputs:
        provider: "azurerm"
        command: "validate"
        workingDirectory: "$(System.DefaultWorkingDirectory)/env/dev"

    # Terraform Format Check
    - script: |
        cd "$(System.DefaultWorkingDirectory)/env/dev"

        terraform fmt -check -recursive
      displayName: "Terraform Formatting Check"

    # Terraform Plan
    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: "azurerm"
        command: "plan"
        workingDirectory: "$(System.DefaultWorkingDirectory)/env/dev"
        environmentServiceNameAzureRM: "azure-ado-sc-unnaoit"


# ============================================================
# Stage 2: Terraform Apply
# ============================================================
- stage: terraform_apply
  dependsOn: terraform_install_init_plan
  condition: succeeded()
  displayName: "Terraform Apply"

  jobs:
  - job: terraform_apply
    displayName: "Terraform Apply Job"

    steps:

    # Checkout repository
    - checkout: self
      displayName: "Checkout Repository"

    # Install Terraform again
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "1.16.2"

    # Terraform Init
    - task: TerraformTask@5
      displayName: "Terraform Initialization"
      inputs:
        provider: "azurerm"
        command: "init"
        workingDirectory: "$(System.DefaultWorkingDirectory)/env/dev"

        backendServiceArm: "azure-ado-sc-unnaoit"
        backendAzureRmResourceGroupName: "akkc"
        backendAzureRmStorageAccountName: "azureadostgtest01"
        backendAzureRmContainerName: "terraformstate"
        backendAzureRmKey: "dev.terraform.tfstate"

    # Terraform Apply
    - task: TerraformTask@5
      displayName: "Terraform Apply"
      inputs:
        provider: "azurerm"
        command: "apply"
        workingDirectory: "$(System.DefaultWorkingDirectory)/env/dev"
        commandOptions: "--auto-approve"
        environmentServiceNameAzureRM: "azure-ado-sc-unnaoit"
