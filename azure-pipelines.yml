trigger: none

pool:
  name: dev-aks-akkc-agent

stages:

# ==========================
# Test Stage
# ==========================
- stage: Test
  displayName: Test Stage
  jobs:
  - job: Test
    displayName: Test Pipeline
    steps:
    - checkout: self
    - script: |
        echo "Deployment Starting..."
        ls -R $(Build.SourcesDirectory)
      displayName: Verify Repository

# ==========================
# Deploy Stage
# ==========================
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Test
  condition: succeeded()

  jobs:
  - deployment: DeployToAKS
    displayName: Deploy to AKS

    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: KubernetesManifest@1
            displayName: Deploy Manifests
            inputs:
              action: deploy
              connectionType: Kubernetes Service Connection
              kubernetesServiceConnection: dev-connection
              namespace: cicd-dev
              manifests: |
                $(Build.SourcesDirectory)/manifests/deployments.yaml
                $(Build.SourcesDirectory)/manifests/svc.yaml
                $(Build.SourcesDirectory)/manifests/configmap.yaml
                $(Build.SourcesDirectory)/manifests/agic-ingress.yaml