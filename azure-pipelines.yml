name: build pipeline

trigger:
 branches:
  include:
    - main
#    - features/*

pool:
 name: dev-aks-akkc-agent


stages:
  - stage: terraform_install_init_plan
    displayName: "Terraform install and init stage"

    jobs:
      - job: terraform_install_and_init
        displayName: "terraform init job"
        steps:
        # - task: TerraformInstaller@1
        #   inputs:
        #     terraformVersion: 'latest'

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '1.16.2'

        # 2. Verify Terraform
        - script: |
            which terraform
            terraform version
            file "$(which terraform)"
          displayName: 'Verify Terraform'

        # - task: TerraformTask@5
        #   displayName: "Terraform initialization"
        #   inputs:
        #     provider: 'azurerm'
        #     command: 'init'
        #     workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        #     backendServiceArm: 'azure-ado-sc-unnaoit'
        #     backendAzureRmResourceGroupName: 'akkc'
        #     backendAzureRmStorageAccountName: 'azureadostgtest01'
        #     backendAzureRmContainerName: 'terraformstate'
        #     backendAzureRmKey: 'dev.terraform.tfstate'
        

        - script: |
            terraform version

            terraform init \
              -backend-config="storage_account_name=azureadostgtest01" \
              -backend-config="container_name=terraformstate" \
              -backend-config="key=dev.terraform.tfstate" \
              -backend-config="resource_group_name=akkc" \
              -backend-config="subscription_id=b8e77924-89da-41ce-8257-846989faab77" \
              -backend-config="use_azuread_auth=true"
          displayName: 'Terraform initialization'


        - task: TerraformTask@5
          displayName: "Terraform Validate"
          inputs:
            provider: 'azurerm'
            command: 'validate'

        - script: |
            terraform fmt -check -recursive
          displayName: "Terraform formatting check"

        - script: |
            cd "$(System.DefaultWorkingDirectory)/env/dev"
            terraform plan
          displayName: "Terraform Plan"

  - stage: terraform_apply
    dependsOn: terraform_install_init_plan
    displayName: "Terraform Apply Stage"
    jobs:
      - job: terraform_apply
        displayName: "Terraform apply jobs"
        steps:
        - task: TerraformTask@5
          displayName: "Terraform initialization"
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'azure-ado-sc-unnaoit'
            backendAzureRmResourceGroupName: 'akkc'
            backendAzureRmStorageAccountName: 'azureadostgtest01'
            backendAzureRmContainerName: 'terraformstate'
            backendAzureRmKey: 'dev.terraform.tfstate'
        

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            commandOptions: '--auto-approve'
            environmentServiceNameAzureRM: 'azure-ado-sc-unnaoit'