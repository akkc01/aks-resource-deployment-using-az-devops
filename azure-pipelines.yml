name: build-pipeline

trigger:
  branches:
    include:
      - main

pool:
  name: dev-aks-akkc-agent

stages:

- stage: terraform_plan
  displayName: "Terraform Plan"

  jobs:
  - job: terraform_plan
    displayName: "Terraform Init Validate Plan"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    # Debug / Verify Terraform
    - script: |
        echo "Terraform path:"
        which terraform

        echo "Terraform version:"
        terraform version

        echo "Terraform binary:"
        file /opt/homebrew/bin/terraform
      displayName: "Verify Terraform"

    # Azure Login
    - task: AzureCLI@2
      displayName: "Azure Login"
      inputs:
        azureSubscription: "azure-ado-sc-unnaoit"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          echo "Azure account:"
          az account show

          echo "Subscription:"
          az account show --query id -o tsv

    # Terraform Init
    - script: |
        cd "$(System.DefaultWorkingDirectory)/env/dev"

        terraform init \
          -backend-config="storage_account_name=azureadostgtest01" \
          -backend-config="container_name=terraformstate" \
          -backend-config="key=dev.terraform.tfstate" \
          -backend-config="resource_group_name=akkc" \
          -backend-config="subscription_id=b8e77924-89da-41ce-8257-846989faab77" \
          -backend-config="use_azuread_auth=true"
      displayName: "Terraform Init"

    # Terraform Validate
    - script: |
        cd "$(System.DefaultWorkingDirectory)/env/dev"
        terraform validate
      displayName: "Terraform Validate"

    # Terraform Format
    - script: |
        cd "$(System.DefaultWorkingDirectory)/env/dev"
        terraform fmt -check -recursive
      displayName: "Terraform Format Check"

    # Terraform Plan
    - script: |
        cd "$(System.DefaultWorkingDirectory)/env/dev"
        terraform plan
      displayName: "Terraform Plan"


- stage: terraform_apply
  displayName: "Terraform Apply"
  dependsOn: terraform_plan
  condition: succeeded()

  jobs:
  - job: terraform_apply
    displayName: "Terraform Apply"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    # Azure Login
    - task: AzureCLI@2
      displayName: "Azure Login"
      inputs:
        azureSubscription: "azure-ado-sc-unnaoit"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          az account show

    # Terraform Init
    - script: |
        cd "$(System.DefaultWorkingDirectory)/env/dev"

        terraform init \
          -backend-config="storage_account_name=azureadostgtest01" \
          -backend-config="container_name=terraformstate" \
          -backend-config="key=dev.terraform.tfstate" \
          -backend-config="resource_group_name=akkc" \
          -backend-config="subscription_id=b8e77924-89da-41ce-8257-846989faab77" \
          -backend-config="use_azuread_auth=true"
      displayName: "Terraform Init"

    # Terraform Apply
    - script: |
        cd "$(System.DefaultWorkingDirectory)/env/dev"
        terraform apply --auto-approve
      displayName: "Terraform Apply"